# Build toolchain for VGPU98. Every build manifest records these versions.
# Install in MSYS2 with: pacman -S --needed <package names below>

[msys2-ucrt64]
mingw-w64-ucrt-x86_64-gcc   = 16.2.0-4
mingw-w64-ucrt-x86_64-cmake = 4.4.4-3
mingw-w64-ucrt-x86_64-ninja = 1.13.2-1
mingw-w64-ucrt-x86_64-nasm  = 3.02-1
mingw-w64-ucrt-x86_64-zlib  = 1.3.2-2

[msys2-ucrt64-86box]
# The GPU in 86Box: its shaders are compiled to SPIR-V at build time, and it
# loads the host's Vulkan driver at run time (vulkan-1.dll, no link-time loader).
mingw-w64-ucrt-x86_64-glslang        = 16.3.0-1
mingw-w64-ucrt-x86_64-vulkan-headers = 1~1.4.363.0-1
# 86Box's own build needs, as its MSYS2 workflow installs them.
mingw-w64-ucrt-x86_64-pkgconf          = 1~3.0.7-2
mingw-w64-ucrt-x86_64-qt5-translations = 5.15.19-1
mingw-w64-ucrt-x86_64-llvm-openmp      = 22.1.8-1
# The libraries 86Box links, statically (their licences: package/release/THIRD-PARTY-NOTICES.txt).
mingw-w64-ucrt-x86_64-brotli          = 1.2.0-1
mingw-w64-ucrt-x86_64-bzip2           = 1.0.8-4
mingw-w64-ucrt-x86_64-flac            = 1.5.0-2
mingw-w64-ucrt-x86_64-fluidsynth      = 2.6.1-1
mingw-w64-ucrt-x86_64-freetype        = 2.14.3-1
mingw-w64-ucrt-x86_64-gettext-runtime = 1.0-1
mingw-w64-ucrt-x86_64-glib2           = 2.90.1-1
mingw-w64-ucrt-x86_64-graphite2       = 1.3.15-1
mingw-w64-ucrt-x86_64-harfbuzz        = 14.6.0-1
mingw-w64-ucrt-x86_64-lame            = 3.100-3
mingw-w64-ucrt-x86_64-libiconv        = 1.19-1
mingw-w64-ucrt-x86_64-libogg          = 1.3.6-1
mingw-w64-ucrt-x86_64-libpng          = 1.6.59-1
mingw-w64-ucrt-x86_64-libserialport   = 0.1.2-1
mingw-w64-ucrt-x86_64-libslirp        = 4.9.3-1
mingw-w64-ucrt-x86_64-libsndfile      = 1.2.2-1
mingw-w64-ucrt-x86_64-libvorbis       = 1.3.7-3
mingw-w64-ucrt-x86_64-mpg123          = 1.33.7-1
mingw-w64-ucrt-x86_64-openal          = 1.25.2-1
mingw-w64-ucrt-x86_64-openssl         = 3.6.5-1
mingw-w64-ucrt-x86_64-opus            = 1.6.1-1
mingw-w64-ucrt-x86_64-pcre2           = 10.49-1
mingw-w64-ucrt-x86_64-portaudio       = 1~19.7.0-7
mingw-w64-ucrt-x86_64-qt5-static      = 5.15.19-1
mingw-w64-ucrt-x86_64-readline        = 8.3.003-1
mingw-w64-ucrt-x86_64-rtmidi          = 6.0.0-3
mingw-w64-ucrt-x86_64-sdl3            = 3.4.18-1
mingw-w64-ucrt-x86_64-termcap         = 1.3.1-7
mingw-w64-ucrt-x86_64-zstd            = 1.5.7-2

[msys2-ucrt64-test]
# Optional: runs BIOS code on the host in tools/biostest.
mingw-w64-ucrt-x86_64-unicorn = 2.1.4-5
